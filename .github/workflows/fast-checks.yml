name: Fast checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    # Raised 15 -> 40 at v1.0.0.  That release took the public suite from 81 to
    # 114 checkers, and the clean-clone guard traces EVERY one of them for file
    # opens, waiting out an 8s quiescence window per checker: measured 741s
    # (12m21s) locally for the guard alone, against a former whole-job budget of
    # 15m.  The guard PASSES -- it is slow, not broken -- so the fix is budget,
    # not a revert.  ubuntu-latest runners are typically slower than the machine
    # that measured this, hence the wide margin.
    #
    # The real fix is upstream: the guard's stopping rule is a quiescence
    # heuristic, which is both the reason it is slow AND a soundness gap (a
    # CPU-starved checker can look quiet while about to open another file -- a
    # missed open is a false PASS). Explicit completion signalling would fix
    # both. Tracked as infrastructure debt; not attempted at release time.
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned SymPy
        run: python -m pip install sympy==1.14.0

      - name: Clean-clone guard
        run: python tools/clean_clone_check.py

      - name: Verify D3 counterexample
        working-directory: d3
        run: python verify.py

      - name: Check f37 certificates
        working-directory: d2
        run: |
          python f37_free_family_verify.py
          python f37_sat_verify.py

      - name: Check field-split ledgers
        working-directory: d2
        run: |
          python t5_split_place_verify.py
          python test_split_place_proofs.py
          python test_split_place_ledger.py

      # The complete sequence measured about 12m15s locally; this independent
      # auditor was the slowest math check (~4m02s) but remains within budget.
      - name: Run representative independent auditor
        working-directory: d2
        run: python audit_inf_cases.py --quiet
