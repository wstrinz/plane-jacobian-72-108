name: Full suite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned SymPy
        run: python -m pip install sympy==1.14.0

      - name: Run full exact suite
        run: SKIP_SLOW=1 bash run_tests.sh
